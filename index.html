<section id="snk-admission" class="snk-admit">
  <style>
    #snk-admission.snk-admit{
      --snk-ink:#14251f;
      --snk-paper:#f6f3ea;
      --snk-card:#ffffff;
      --snk-line:#dcd6c4;
      --snk-green:#1f6f4d;
      --snk-green-dark:#154e37;
      --snk-gold:#b9822c;
      --snk-free:#2f6fb0;
      --snk-red:#a4342a;
      --snk-radius:14px;
      font-family: 'Segoe UI', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
      background:var(--snk-paper);
      color:var(--snk-ink);
      padding:56px 18px;
      border-top:1px solid var(--snk-line);
      border-bottom:1px solid var(--snk-line);
    }
    #snk-admission.snk-admit *{box-sizing:border-box;}
    #snk-admission .snk-wrap{max-width:760px;margin:0 auto;}

    /* ---- Brand header (logo + name) ---- */
    #snk-admission .snk-brand{
      display:flex; align-items:center; gap:12px; margin-bottom:22px;
    }
    #snk-admission .snk-brand-mark{
      width:44px; height:44px; border-radius:10px;
      background:linear-gradient(135deg, var(--snk-green), var(--snk-green-dark));
      color:#fff; display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:16px; letter-spacing:.02em; flex-shrink:0;
    }
    /* এখানে img বসিয়ে real logo দিতে পারবেন, নিচে instruction আছে */
    #snk-admission .snk-brand-name{font-weight:800; font-size:18px; line-height:1.2;}
    #snk-admission .snk-brand-tag{font-size:12px; color:var(--snk-gold); font-weight:700; letter-spacing:.04em;}

    #snk-admission .snk-eyebrow{
      font-size:12px; letter-spacing:.14em; text-transform:uppercase;
      color:var(--snk-green-dark); font-weight:700; margin-bottom:8px;
    }
    #snk-admission h2{
      font-size:clamp(24px,4vw,34px); margin:0 0 6px; font-weight:800; line-height:1.2;
    }
    #snk-admission .snk-sub{color:#57604f; margin:0 0 30px; font-size:15px;}
    #snk-admission .snk-card{
      background:var(--snk-card); border:1px solid var(--snk-line);
      border-radius:var(--snk-radius); padding:28px; box-shadow:0 1px 3px rgba(20,37,31,.06);
    }
    #snk-admission label{
      display:block; font-size:13px; font-weight:700; margin:18px 0 6px; color:var(--snk-ink);
    }
    #snk-admission label:first-of-type{margin-top:0;}
    #snk-admission input[type=text],
    #snk-admission input[type=tel],
    #snk-admission input[type=email],
    #snk-admission select{
      width:100%; padding:11px 12px; border:1.5px solid var(--snk-line);
      border-radius:9px; font-size:15px; background:#fff; color:var(--snk-ink);
      font-family:inherit;
    }
    #snk-admission input:focus, #snk-admission select:focus{
      outline:2px solid var(--snk-green); outline-offset:1px; border-color:var(--snk-green);
    }
    #snk-admission optgroup{font-weight:700;}
    #snk-admission .snk-badge{
      display:inline-block; font-size:11px; font-weight:800; letter-spacing:.03em;
      padding:3px 9px; border-radius:100px; margin-left:8px; vertical-align:1px;
    }
    #snk-admission .snk-badge.free{background:#e7f0f9; color:var(--snk-free);}
    #snk-admission .snk-badge.paid{background:#fbeee0; color:var(--snk-gold);}
    #snk-admission .snk-fee-box{
      margin-top:20px; border-radius:11px; padding:18px; display:none;
    }
    #snk-admission .snk-fee-box.show{display:block;}
    #snk-admission .snk-fee-box.free-box{background:#eef6f1; border:1px solid #cfe6d8;}
    #snk-admission .snk-fee-box.paid-box{background:#fbf8ef; border:1px solid #ecdfb9;}
