<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CakeBuddy — Discover Something Delicious</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #fafafa;

      color: #111;

    }


    /* =========================
       HEADER
    ========================= */

    header {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid #eee;

    }


    .nav {

      max-width: 1200px;

      margin: auto;

      height: 72px;

      padding: 0 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

    }


    .logo {

      display: flex;

      align-items: center;

      gap: 10px;

      text-decoration: none;

      color: #111;

      font-size: 21px;

      font-weight: 900;

    }


    .logo-icon {

      width: 42px;

      height: 42px;

      border-radius: 12px;

      background: #111;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 13px;

    }


    .admin-link {

      text-decoration: none;

      color: #555;

      border: 1px solid #ddd;

      padding: 10px 15px;

      border-radius: 9px;

      font-size: 13px;

      font-weight: 700;

    }


    .admin-link:hover {

      background: #111;

      color: white;

      border-color: #111;

    }


    /* =========================
       HERO
    ========================= */

    .hero {

      max-width: 1200px;

      margin: auto;

      padding:
        75px 20px 55px;

      text-align: center;

    }


    .hero-badge {

      display: inline-block;

      padding: 7px 12px;

      background: #f1f1f1;

      border-radius: 30px;

      color: #555;

      font-size: 11px;

      font-weight: 700;

      margin-bottom: 18px;

    }


    .hero h1 {

      font-size:
        clamp(38px, 6vw, 68px);

      line-height: 1.05;

      letter-spacing: -2px;

      max-width: 800px;

      margin: auto;

    }


    .hero h1 span {

      color: #777;

    }


    .hero p {

      max-width: 600px;

      margin: 20px auto 0;

      color: #777;

      line-height: 1.7;

      font-size: 15px;

    }


    /* =========================
       SEARCH
    ========================= */

    .search-wrap {

      max-width: 650px;

      margin:
        30px auto 0;

      position: relative;

    }


    .search {

      width: 100%;

      height: 52px;

      border:
        1px solid #ddd;

      border-radius: 14px;

      padding:
        0 20px 0 48px;

      outline: none;

      font-size: 14px;

      background: white;

    }


    .search:focus {

      border-color: #111;

    }


    .search-icon {

      position: absolute;

      left: 18px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #888;

    }


    /* =========================
       POSTS SECTION
    ========================= */

    .section {

      max-width: 1200px;

      margin: auto;

      padding:
        20px 20px 70px;

    }


    .section-title {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 22px;

    }


    .section-title h2 {

      font-size: 24px;

    }


    .section-title span {

      color: #888;

      font-size: 12px;

    }


    /* =========================
       GRID
    ========================= */

    .posts-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 22px;

    }


    .post-card {

      background: white;

      border:
        1px solid #eee;

      border-radius: 17px;

      overflow: hidden;

      transition:
        transform .2s,
        box-shadow .2s;

    }


    .post-card:hover {

      transform:
        translateY(-4px);

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.08);

    }


    .post-image {

      width: 100%;

      height: 220px;

      object-fit: cover;

      display: block;

      background: #eee;

    }


    .post-content {

      padding: 20px;

    }


    .category {

      display: inline-block;

      padding:
        5px 9px;

      background: #f1f1f1;

      border-radius: 6px;

      font-size: 10px;

      font-weight: 800;

      color: #555;

      margin-bottom: 12px;

    }


    .post-content h3 {

      font-size: 18px;

      line-height: 1.35;

      margin-bottom: 9px;

    }


    .post-content p {

      color: #777;

      font-size: 13px;

      line-height: 1.6;

      display: -webkit-box;

      -webkit-line-clamp: 3;

      -webkit-box-orient: vertical;

      overflow: hidden;

    }


    .post-footer {

      margin-top: 18px;

      padding-top: 14px;

      border-top:
        1px solid #eee;

      color: #999;

      font-size: 11px;

    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      grid-column:
        1 / -1;

      text-align: center;

      padding: 70px 20px;

      color: #888;

    }


    .loading-icon {

      font-size: 35px;

      margin-bottom: 10px;

    }


    /* =========================
       EMPTY
    ========================= */

    .empty {

      grid-column:
        1 / -1;

      text-align: center;

      padding: 70px 20px;

      background: white;

      border:
        1px solid #eee;

      border-radius: 16px;

    }


    .empty-icon {

      font-size: 40px;

      margin-bottom: 12px;

    }


    .empty h3 {

      font-size: 18px;

      margin-bottom: 7px;

    }


    .empty p {

      color: #888;

      font-size: 13px;

    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      border-top:
        1px solid #eee;

      padding:
        25px 20px;

      text-align: center;

      color: #888;

      font-size: 12px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .posts-grid {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media (max-width: 600px) {

      .nav {

        height: 64px;

      }


      .logo {

        font-size: 18px;

      }


      .logo-icon {

        width: 37px;

        height: 37px;

      }


      .admin-link {

        padding:
          8px 11px;

        font-size: 11px;

      }


      .hero {

        padding:
          55px 18px 40px;

      }


      .hero h1 {

        letter-spacing:
          -1px;

      }


      .hero p {

        font-size: 13px;

      }


      .section {

        padding:
          15px 15px 50px;

      }


      .posts-grid {

        grid-template-columns:
          1fr;

      }


      .post-image {

        height: 210px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <nav class="nav">


      <a
        href="index.html"
        class="logo"
      >

        <div class="logo-icon">
          CB
        </div>

        CakeBuddy

      </a>


      <a
        href="admin.html"
        class="admin-link"
      >

        Developer Connect
        →

      </a>


    </nav>

  </header>



  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">


    <div class="hero-badge">
      ✦ CakeBuddy Community
    </div>


    <h1>

      Discover

      <span>
        Something Delicious.
      </span>

    </h1>


    <p>

      নতুন পোস্ট, অফার, রেসিপি এবং CakeBuddy-এর
      latest updates এক জায়গায় দেখুন।

    </p>


    <div class="search-wrap">

      <span class="search-icon">
        🔍
      </span>


      <input
        type="search"
        id="searchInput"
        class="search"
        placeholder="Search posts..."
      >

    </div>


  </section>



  <!-- =========================
       POSTS
  ========================= -->

  <section class="section">


    <div class="section-title">

      <h2>
        Latest Posts
      </h2>


      <span id="postTotal">
        Loading...
      </span>

    </div>


    <div
      id="postsGrid"
      class="posts-grid"
    >

      <div class="loading">

        <div class="loading-icon">
          ⏳
        </div>

        Loading posts...

      </div>

    </div>


  </section>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    © 2026 CakeBuddy.
    All rights reserved.

  </footer>



  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">


    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy
    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDlqm0Du94pfQ_LwUJTTi8LjhzK90dN0TQ",

      authDomain:
        "cakebuddymb.firebaseapp.com",

      projectId:
        "cakebuddymb",

      storageBucket:
        "cakebuddymb.firebasestorage.app",

      messagingSenderId:
        "31596118058",

      appId:
        "1:31596118058:web:ecfe00171d91ee15c64353",

      measurementId:
        "G-D0ZV3FN1LQ"

    };


    /* =========================
       FIREBASE INIT
    ========================= */

    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    /* =========================
       ELEMENTS
    ========================= */

    const postsGrid =
      document.getElementById(
        "postsGrid"
      );


    const postTotal =
      document.getElementById(
        "postTotal"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    let allPosts = [];


    /* =========================
       LOAD POSTS
    ========================= */

    async function loadPosts() {

      try {


        const postsQuery =
          query(

            collection(
              db,
              "posts"
            ),

            orderBy(
              "createdAt",
              "desc"
            )

          );


        const snapshot =
          await getDocs(
            postsQuery
          );


        allPosts = [];


        snapshot.forEach(
          function(documentSnapshot) {

            allPosts.push({

              id:
                documentSnapshot.id,

              ...documentSnapshot.data()

            });

          }
        );


        postTotal.textContent =
          allPosts.length +
          " Posts";


        displayPosts(
          allPosts
        );


      } catch (error) {

        console.error(
          "Firebase Error:",
          error
        );


        postsGrid.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              ⚠️
            </div>

            <h3>
              Posts load করা যায়নি
            </h3>

            <p>
              Firebase Firestore Rules অথবা Database check করুন।
            </p>

          </div>

        `;


        postTotal.textContent =
          "Error";

      }

    }


    /* =========================
       DISPLAY POSTS
    ========================= */

    function displayPosts(
      posts
    ) {


      if (!posts.length) {

        postsGrid.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              📝
            </div>

            <h3>
              এখনো কোনো পোস্ট নেই
            </h3>

            <p>
              খুব শীঘ্রই নতুন content আসবে।
            </p>

          </div>

        `;

        return;

      }


      postsGrid.innerHTML = "";


      posts.forEach(
        function(post) {


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "post-card";


          const image =
            post.image ||
            "https://via.placeholder.com/800x500?text=CakeBuddy";


          const title =
            post.title ||
            "Untitled Post";


          const category =
            post.category ||
            "General";


          const description =
            post.description ||
            "";


          let dateText =
            "Recently";


          if (
            post.createdAt
          ) {

            try {

              dateText =
                post.createdAt
                  .toDate()
                  .toLocaleDateString(
                    "en-GB",
                    {
                      day: "2-digit",
                      month: "short",
                      year: "numeric"
                    }
                  );

            } catch (error) {

              dateText =
                "Recently";

            }

          }


          card.innerHTML = `

            <img
              class="post-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(title)}"
              onerror="this.src='https://via.placeholder.com/800x500?text=CakeBuddy'"
            >


            <div class="post-content">

              <span class="category">
                ${escapeHtml(category)}
              </span>


              <h3>
                ${escapeHtml(title)}
              </h3>


              <p>
                ${escapeHtml(description)}
              </p>


              <div class="post-footer">

                📅 ${dateText}

              </div>

            </div>

          `;


          postsGrid.appendChild(
            card
          );

        }
      );

    }


    /* =========================
       SEARCH
    ========================= */

    searchInput.addEventListener(
      "input",
      function() {


        const keyword =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!keyword) {

          displayPosts(
            allPosts
          );

          return;

        }


        const filtered =
          allPosts.filter(
            function(post) {


              const title =
                (
                  post.title ||
                  ""
                ).toLowerCase();


              const description =
                (
                  post.description ||
                  ""
                ).toLowerCase();


              const category =
                (
                  post.category ||
                  ""
                ).toLowerCase();


              return (

                title.includes(
                  keyword
                )

                ||

                description.includes(
                  keyword
                )

                ||

                category.includes(
                  keyword
                )

              );

            }
          );


        displayPosts(
          filtered
        );


      }
    );


    /* =========================
       HTML SECURITY
    ========================= */

    function escapeHtml(
      value
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        String(value);


      return div.innerHTML;

    }


    /* =========================
       START
    ========================= */

    loadPosts();


  </script>


</body>

</html>
```
