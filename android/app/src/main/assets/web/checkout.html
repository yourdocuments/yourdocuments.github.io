<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0a"><link rel="manifest" href="manifest.json"><title>Checkout | SNK OnePay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070908;color:#f4f7f2;font-family:Inter,Arial}.wrap{max-width:900px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center}.mark{display:inline-grid;place-items:center;width:42px;height:42px;background:#b7ff00;color:#071000;border-radius:12px;font-weight:900}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.box{margin:50px auto;max-width:620px;background:#0e120f;border:1px solid #ffffff12;border-radius:25px;padding:30px}h1{font-size:34px}.muted{color:#89928b;line-height:1.7}.summary{background:#090c0a;border:1px solid #ffffff0c;border-radius:16px;padding:18px;margin:20px 0}.amount{font-size:38px;font-weight:800;color:#b7ff00}.row{display:flex;justify-content:space-between;margin:9px 0;color:#aab2ab;font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:7px}.input{width:100%;height:48px;border-radius:12px;border:1px solid #ffffff12;background:#080a09;color:#fff;padding:0 14px;outline:none}.input:focus{border-color:#b7ff00}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method{padding:15px;border:1px solid #ffffff12;border-radius:13px;background:#090c0a;color:#aaa;cursor:pointer}.method.active{border-color:#b7ff00;color:#b7ff00}.pay{width:100%;height:52px;border:0;border-radius:13px;background:#b7ff00;color:#071000;font-weight:900;cursor:pointer}.check{display:flex;gap:8px;font-size:11px;color:#89928b;margin:18px 0}.check input{accent-color:#b7ff00}@media(max-width:550px){.methods{grid-template-columns:1fr}.box{padding:20px;margin-top:30px}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="index.html"><span class="mark">SP</span>SNK OnePay</a><a href="index.html">← Back</a></div><div class="box"><h1>Secure Checkout</h1><p class="muted">Complete your payment through SNK OnePay.</p><div class="summary"><div class="amount" id="amount">৳2,999</div><div class="row"><span>Product</span><b id="product">Premium Website Package</b></div><div class="row"><span>Website</span><b id="site">Website Deals</b></div><div class="row"><span>Order</span><b id="order">WD-10291</b></div></div><div class="field"><label>Name</label><input class="input" id="name" required placeholder="Your full name"></div><div class="field"><label>Email</label><input class="input" id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Phone</label><input class="input" id="phone" required placeholder="01XXXXXXXXX"></div><div class="field"><label>Payment Method</label><div class="methods"><div class="method active" data-method="bKash">bKash</div><div class="method" data-method="Nagad">Nagad</div><div class="method" data-method="Card">Card</div></div></div><label class="check"><input type="checkbox" id="terms"> I agree to the payment terms and confirm the information is correct.</label><button class="pay" id="pay">Continue to Payment</button></div></div>
<script>
const q=new URLSearchParams(location.search);const val=(k,d)=>q.get(k)||d;
amount.textContent="৳"+Number(val("amount","2999")).toLocaleString("en-BD");product.textContent=val("product","Premium Website Package");site.textContent=val("site","Website Deals");order.textContent=val("order","WD-10291");
let method="bKash";document.querySelectorAll(".method").forEach(x=>x.onclick=()=>{document.querySelectorAll(".method").forEach(y=>y.classList.remove("active"));x.classList.add("active");method=x.dataset.method});
pay.onclick=()=>{if(!name.value.trim()||!email.value.trim()||!phone.value.trim()||!terms.checked){alert("Please complete all required fields.");return}location.href="success.html?amount="+encodeURIComponent(val("amount","2999"))+"&product="+encodeURIComponent(val("product","Premium Website Package"))+"&site="+encodeURIComponent(val("site","Website Deals"))+"&order="+encodeURIComponent(val("order","WD-10291"))+"&method="+encodeURIComponent(method)};
</script></body></html>
