<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Failed | SNK OnePay</title><style>*{box-sizing:border-box}body{margin:0;background:#070908;color:#f4f7f2;font-family:Inter,Arial;min-height:100vh;display:grid;place-items:center}.box{width:min(92%,560px);padding:35px;background:#0e120f;border:1px solid #ffffff12;border-radius:25px;text-align:center}.icon{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;background:#ff6d7a;color:#170406;font-size:27px;margin:auto}h1{margin:20px 0 8px}.p{color:#89928b;line-height:1.7}.btn{display:inline-block;padding:13px 18px;background:#b7ff00;color:#071000;border-radius:12px;font-weight:800;margin:5px}</style></head><body><div class="box"><div class="icon">!</div><h1>Payment Not Completed</h1><p class="p">The demo payment was cancelled or could not be completed.</p><a class="btn" id="retry">Try Payment Again</a><a class="btn" href="index.html">Back to OnePay</a></div><script>const q=new URLSearchParams(location.search);const p=new URLSearchParams();["amount","product","site","order"].forEach(k=>{if(q.get(k))p.set(k,q.get(k))});retry.href="checkout.html?"+p.toString();</script></body></html>
