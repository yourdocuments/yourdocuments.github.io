<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0a"><title>Payment Successful | SNK OnePay</title><style>
*{box-sizing:border-box}body{margin:0;background:#070908;color:#f4f7f2;font-family:Inter,Arial;min-height:100vh;display:grid;place-items:center}.box{width:min(92%,600px);padding:35px;background:#0e120f;border:1px solid #ffffff12;border-radius:26px;text-align:center}.icon{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#b7ff00;color:#071000;font-size:30px;margin:auto}h1{margin:20px 0 8px}.ok{color:#55e69a;font-weight:800}.receipt{text-align:left;margin:25px 0;background:#090c0a;border-radius:15px;padding:18px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff0a;color:#8d968f;font-size:13px}.row:last-child{border:0}.row b{color:#eee}.btn{display:inline-block;padding:13px 18px;background:#b7ff00;color:#071000;border-radius:12px;font-weight:800;margin:4px}.note{font-size:11px;color:#687169;line-height:1.7;margin-top:18px}</style></head><body><div class="box"><div class="icon">✓</div><h1>Payment Successful</h1><div class="ok">Demo payment completed</div><div class="receipt"><div class="row"><span>Order</span><b id="order"></b></div><div class="row"><span>Transaction</span><b id="tx"></b></div><div class="row"><span>Method</span><b id="method"></b></div><div class="row"><span>Website</span><b id="site"></b></div><div class="row"><span>Product</span><b id="product"></b></div><div class="row"><span>Amount</span><b id="amount"></b></div></div><a class="btn" href="index.html">Back to OnePay</a><button class="btn" onclick="print()">Print Receipt</button><p class="note">Production version must verify the provider transaction server-side before the original website is marked PAID.</p></div><script>const q=new URLSearchParams(location.search);const v=(k,d="—")=>q.get(k)||d;order.textContent=v("order");method.textContent=v("method");site.textContent=v("site");product.textContent=v("product");amount.textContent="৳"+Number(v("amount","0")).toLocaleString("en-BD");tx.textContent="SNK-"+Math.random().toString(36).slice(2,8).toUpperCase();</script></body></html>
