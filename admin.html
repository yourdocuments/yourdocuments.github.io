<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login — CakeBuddy</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      width: 70px;
      height: 70px;

      background: #111;
      color: white;

      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 15px;

      font-size: 20px;
      font-weight: 900;
    }

    .brand h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .brand p {
      color: #777;
      font-size: 14px;
    }

    .login-card {
      background: white;

      border: 1px solid #e8e8e8;

      border-radius: 22px;

      padding: 30px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, .08);
    }

    .login-card h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;

      margin-bottom: 25px;

      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 8px;
    }

    .input {
      width: 100%;

      padding: 14px;

      border: 1px solid #ddd;

      border-radius: 10px;

      outline: none;

      font-size: 15px;

      transition: .2s;
    }

    .input:focus {
      border-color: #111;

      box-shadow:
        0 0 0 3px rgba(0, 0, 0, .05);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .input {
      padding-right: 48px;
    }

    .show-password {
      position: absolute;

      right: 12px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      cursor: pointer;

      font-size: 18px;
    }

    .login-submit {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #111;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .login-submit:hover {
      background: #222;
      transform: translateY(-1px);
    }

    .login-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;

      padding: 12px;

      border-radius: 9px;

      font-size: 13px;

      margin-bottom: 15px;

      text-align: center;

      line-height: 1.5;
    }

    .error-message {
      background: #fff1f1;
      border: 1px solid #ffd4d4;
      color: #c00000;
    }

    .success-message {
      background: #effff4;
      border: 1px solid #c8f2d4;
      color: #16803c;
    }

    .back-link {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #777;

      text-decoration: none;

      font-size: 13px;
    }

    .back-link:hover {
      color: #111;
    }

    .security {
      margin-top: 20px;

      text-align: center;

      color: #999;

      font-size: 12px;

      line-height: 1.6;
    }

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .login-card {
        padding: 24px 20px;
      }

      .brand h1 {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


  <div class="login-container">


    <!-- BRAND -->

    <div class="brand">

      <div class="brand-logo">
        SNK
      </div>

      <h1>
        Admin Access
      </h1>

      <p>
        CakeBuddy Management System
      </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

      <h2>
        Welcome back 👋
      </h2>

      <p class="subtitle">
        Sign in with your administrator account
        to continue.
      </p>


      <!-- ERROR -->

      <div
        id="errorMessage"
        class="message error-message"
      >
      </div>


      <!-- SUCCESS -->

      <div
        id="successMessage"
        class="message success-message"
      >
      </div>


      <!-- FORM -->

      <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Admin Email
          </label>

          <input
            class="input"
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="username"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              class="input"
              type="password"
              id="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- LOGIN -->

        <button
          type="submit"
          class="login-submit"
          id="loginButton"
        >
          Login to Dashboard →
        </button>


      </form>


      <!-- BACK -->

      <a
        href="developer.html"
        class="back-link"
      >
        ← Back to Developer Connect
      </a>


    </div>


    <!-- SECURITY -->

    <div class="security">

      🔒 Secure Firebase Authentication<br>

      Authorized administrator access only.

    </div>


  </div>



  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDlqm0Du94pfQ_LwUJTTi8LjhzK90dN0TQ",

      authDomain:
        "cakebuddymb.firebaseapp.com",

      projectId:
        "cakebuddymb",

      storageBucket:
        "cakebuddymb.firebasestorage.app",

      messagingSenderId:
        "31596118058",

      appId:
        "1:31596118058:web:ecfe00171d91ee15c64353",

      measurementId:
        "G-D0ZV3FN1LQ"

    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const showPassword =
      document.getElementById("showPassword");

    const errorMessage =
      document.getElementById("errorMessage");

    const successMessage =
      document.getElementById("successMessage");


    /* =========================
       SHOW PASSWORD
    ========================= */

    showPassword.addEventListener(
      "click",
      function () {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          showPassword.textContent = "🙈";

        } else {

          passwordInput.type = "password";

          showPassword.textContent = "👁️";

        }

      }
    );


    /* =========================
       SHOW ERROR
    ========================= */

    function showError(message) {

      errorMessage.textContent =
        "❌ " + message;

      errorMessage.style.display =
        "block";

      successMessage.style.display =
        "none";

    }


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showError(
            "Email এবং password দিন।"
          );

          return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Signing in...";


        errorMessage.style.display =
          "none";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          successMessage.textContent =
            "✅ Login successful! Dashboard খুলছে...";

          successMessage.style.display =
            "block";


          setTimeout(
            function () {

              window.location.href =
                "dashboard.html";

            },
            800
          );


        } catch (error) {

          console.error(error);


          let message =
            "Login failed. Email অথবা password check করুন।";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message =
              "Email অথবা password সঠিক নয়।";

          }

          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            message =
              "এই email দিয়ে কোনো admin account পাওয়া যায়নি।";

          }

          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            message =
              "Password সঠিক নয়।";

          }

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message =
              "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

          }


          showError(message);


          loginButton.disabled = false;

          loginButton.textContent =
            "Login to Dashboard →";

        }

      }
    );

  </script>


</body>

</html>
```
