<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | CakeBuddy</title>

  <meta
    name="description"
    content="CakeBuddy Admin Login"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          rgba(255, 182, 193, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(255, 214, 165, 0.35),
          transparent 35%
        ),
        #fffaf7;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);

      border: 1px solid rgba(0, 0, 0, 0.06);

      border-radius: 28px;

      padding: 42px 34px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08);

      backdrop-filter: blur(16px);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        #ff6b81,
        #ff9a76
      );

      color: white;

      font-size: 30px;
      font-weight: 800;

      box-shadow:
        0 12px 30px rgba(255, 107, 129, 0.25);
    }

    .brand h1 {
      font-size: 30px;
      line-height: 1.2;

      color: #1f1f1f;

      margin-bottom: 8px;
    }

    .brand p {
      color: #777;
      font-size: 14px;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 7px 13px;

      margin-top: 14px;

      border-radius: 999px;

      background: #fff0f2;
      color: #e94f68;

      font-size: 12px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 700;

      color: #333;
    }

    input {
      width: 100%;

      height: 54px;

      padding: 0 16px;

      border: 1px solid #e4e4e4;

      border-radius: 14px;

      background: #fff;

      color: #222;

      font-size: 15px;

      outline: none;

      transition: 0.2s ease;
    }

    input:focus {
      border-color: #ff7185;

      box-shadow:
        0 0 0 4px rgba(255, 113, 133, 0.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 58px;
    }

    .toggle-password {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #777;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;
    }

    .login-button {
      width: 100%;

      height: 56px;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #ff647d,
          #ff9675
        );

      color: white;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;

      box-shadow:
        0 12px 25px rgba(255, 100, 125, 0.22);
    }

    .login-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 15px 30px rgba(255, 100, 125, 0.28);
    }

    .login-button:disabled {
      opacity: 0.65;

      cursor: not-allowed;

      transform: none;
    }

    .message {
      display: none;

      margin-bottom: 18px;

      padding: 13px 14px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: #fff1f2;

      color: #c62842;

      border: 1px solid #ffd4da;
    }

    .message.success {
      display: block;

      background: #effbf3;

      color: #18753b;

      border: 1px solid #ccefd8;
    }

    .back-link {
      display: block;

      text-align: center;

      margin-top: 24px;

      color: #666;

      text-decoration: none;

      font-size: 14px;
      font-weight: 600;
    }

    .back-link:hover {
      color: #ff647d;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #999;

      font-size: 12px;
    }

    .loading-text {
      display: none;

      text-align: center;

      margin-top: 12px;

      color: #777;

      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 32px 22px;

        border-radius: 22px;
      }

      .brand h1 {
        font-size: 26px;
      }

      .logo {
        width: 64px;
        height: 64px;

        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="brand">

        <div class="logo">
          C
        </div>

        <h1>Admin Panel</h1>

        <p>
          Sign in to manage CakeBuddy
        </p>

        <div class="admin-badge">
          🔐 Secure Admin Access
        </div>

      </div>


      <div
        id="message"
        class="message"
      ></div>


      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter admin email"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >
              Show
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Login to Dashboard
        </button>

        <div
          class="loading-text"
          id="loadingText"
        >
          Signing you in...
        </div>

      </form>


      <a
        href="./index.html"
        class="back-link"
      >
        ← Back to CakeBuddy
      </a>

    </section>


    <div class="footer">
      © 2026 CakeBuddy. Admin access only.
    </div>

  </main>


  <!-- Firebase -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /*
      =====================================================
      FIREBASE CONFIG
      =====================================================

      এখানে আপনার Firebase Web App-এর আসল configuration
      বসাবেন।

      Firebase Console:
      Project Settings
      → General
      → Your apps
      → Web app
      → SDK setup and configuration

      আপনার dashboard.html / add-post.html-এ যে config
      ব্যবহার করছেন, ঠিক সেই একই config ব্যবহার করুন।
    */

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain:
        "cakebuddymb.firebaseapp.com",

      projectId:
        "cakebuddymb",

      storageBucket:
        "cakebuddymb.firebasestorage.app",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"

    };


    /*
      Initialize Firebase
    */

    const app =
      initializeApp(firebaseConfig);


    /*
      Initialize Authentication
    */

    const auth =
      getAuth(app);


    /*
      Elements
    */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const togglePassword =
      document.getElementById("togglePassword");

    const message =
      document.getElementById("message");

    const loadingText =
      document.getElementById("loadingText");


    /*
      Show Message
    */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /*
      Clear Message
    */

    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    /*
      Password Show / Hide
    */

    togglePassword.addEventListener(
      "click",
      () => {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          togglePassword.textContent =
            "Hide";

        } else {

          passwordInput.type =
            "password";

          togglePassword.textContent =
            "Show";

        }

      }
    );


    /*
      Check Existing Login

      যদি admin আগে থেকেই login করা থাকে,
      তাহলে সরাসরি dashboard-এ যাবে।
    */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          window.location.href =
            "./admin/dashboard.html";

        }

      }
    );


    /*
      Login
    */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessage();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter your email and password."
          );

          return;

        }


        /*
          Loading State
        */

        loginButton.disabled = true;

        loginButton.textContent =
          "Signing In...";

        loadingText.style.display =
          "block";


        try {

          /*
            Firebase Email/Password Login
          */

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          /*
            Success
          */

          showMessage(
            "Login successful. Redirecting to dashboard...",
            "success"
          );


          /*
            Dashboard
          */

          setTimeout(
            () => {

              window.location.href =
                "./admin/dashboard.html";

            },
            500
          );


        } catch (error) {

          console.error(
            "Login Error:",
            error
          );


          let errorMessage =
            "Login failed. Please check your email and password.";


          /*
            Firebase Error Messages
          */

          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            errorMessage =
              "Incorrect email or password.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            errorMessage =
              "Please enter a valid email address.";

          }

          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            errorMessage =
              "No admin account was found with this email.";

          }

          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            errorMessage =
              "Incorrect password.";

          }

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            errorMessage =
              "Too many login attempts. Please try again later.";

          }

          else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            errorMessage =
              "Network error. Please check your internet connection.";

          }


          showMessage(
            errorMessage
          );


          /*
            Reset Loading State
          */

          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login to Dashboard";

          loadingText.style.display =
            "none";

        }

      }
    );

  </script>

</body>
</html>
